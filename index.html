<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twin Bridge Roofing — Instant Estimate</title>
<style>
  :root{
    --red:#e31e24; --red-dark:#b8171c; --ink:#1a1919; --bg:#f4f5f7;
    --line:#e7e7e7; --muted:#6b6b6b; --green:#1e9e5a; --card:#ffffff;
    --shadow:0 8px 30px rgba(20,20,25,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#fbfbfc;box-shadow:0 0 60px rgba(0,0,0,.06);}
  header{background:#fff;border-bottom:3px solid var(--red);padding:12px 18px;display:flex;align-items:center;gap:12px;}
  header .brand{height:54px;width:auto;display:block;}
  header .award{margin-left:auto;font-size:10px;color:var(--ink);background:#fbf5e2;border:1px solid #efe1b0;
    padding:5px 10px;border-radius:20px;text-align:center;line-height:1.25;white-space:nowrap;}
  header .award b{color:#b07d0a;display:block;font-size:10px;}
  .progress{height:4px;background:#eaeaea;}
  .progress .bar{height:100%;background:var(--red);width:0;transition:width .35s ease;}
  main{flex:1;padding:22px 20px 40px;}
  .step{animation:fade .3s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .hero{position:relative;width:100%;border-radius:16px;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow);line-height:0;background:#dfe4ea;}
  .hero img{width:100%;height:210px;object-fit:cover;display:block;}
  .hero .ov{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,.05) 55%);
    display:flex;align-items:flex-end;padding:16px 18px;}
  .hero .ov span{color:#fff;font-weight:800;font-size:17px;line-height:1.2;letter-spacing:-.2px;text-shadow:0 1px 6px rgba(0,0,0,.5);}
  .eyebrow{color:var(--red);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
  h1{font-size:24px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px;}
  .sub{color:var(--muted);font-size:14.5px;margin-bottom:20px;}
  .cards{display:flex;flex-direction:column;gap:12px;}
  .opt{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;
    text-align:left;transition:.15s;display:flex;align-items:center;gap:14px;width:100%;font-size:15.5px;font-weight:700;color:var(--ink);}
  .opt:hover{border-color:var(--red);box-shadow:var(--shadow);transform:translateY(-1px);}
  .opt .sm{font-weight:500;font-size:12.5px;color:var(--muted);display:block;margin-top:2px;}
  .opt .tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--red);background:#fdeaea;border-radius:20px;padding:2px 8px;margin-top:5px;}
  .opt .chev{margin-left:auto;color:#c9c9c9;flex:none;}
  .pic{width:86px;height:72px;border-radius:11px;overflow:hidden;flex:none;background:#e7edf3;}
  .pic img{width:100%;height:100%;object-fit:cover;display:block;}
  .swatch{width:88px;height:60px;border-radius:11px;overflow:hidden;flex:none;border:1px solid var(--line);background:#e7e7e7;}
  .swatch svg{width:100%;height:100%;display:block;}
  .swatch img.prod{width:100%;height:100%;object-fit:contain;display:block;}
  .swatch img.prod.fill{object-fit:cover;}
  .field{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:20px 18px;margin-bottom:14px;}
  input[type=range]{width:100%;accent-color:var(--red);height:6px;}
  .sizeout{text-align:center;font-size:30px;font-weight:800;color:var(--ink);margin:6px 0 2px;}
  .sizeout small{font-size:14px;color:var(--muted);font-weight:600;}
  .rangelabels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px;}
  input[type=text],input[type=email],input[type=tel]{width:100%;padding:13px 14px;border:1.5px solid var(--line);
    border-radius:11px;font-size:16px;font-family:inherit;color:var(--ink);}
  input:focus{outline:none;border-color:var(--red);}
  .addrwrap{position:relative;margin-bottom:14px;}
  .addrsug{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1.5px solid var(--line);border-radius:11px;box-shadow:var(--shadow);z-index:30;display:none;overflow:hidden;}
  .addropt{padding:12px 14px;font-size:14px;cursor:pointer;border-bottom:1px solid #f2f2f2;display:flex;gap:9px;align-items:center;}
  .addropt:last-child{border-bottom:none;}
  .addropt:hover{background:#fdeaea;color:var(--red);}
  .addropt svg{flex:none;color:var(--red);}
  .measured{background:#eafaf0;border:1px solid #b6e6c8;color:#177a44;border-radius:10px;padding:11px 13px;font-size:13px;margin-top:4px;display:flex;gap:8px;align-items:flex-start;font-weight:600;}
  .measured svg{flex:none;color:var(--green);margin-top:1px;}
  .note{font-size:12px;color:var(--muted);background:#fff7e6;border:1px solid #ffe4a3;border-radius:10px;
    padding:10px 12px;margin-top:4px;display:flex;gap:8px;align-items:flex-start;}
  .note svg{flex:none;color:#c98a00;margin-top:1px;}
  .nav{display:flex;gap:10px;margin-top:22px;}
  .btn{border:none;border-radius:12px;padding:15px 22px;font-size:15.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;flex:1;}
  .btn-primary{background:var(--red);color:#fff;}
  .btn-primary:hover{background:var(--red-dark);}
  .btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);flex:none;padding:15px 18px;}
  .btn-ghost:hover{border-color:#bbb;}
  .estcard{background:var(--card);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line);}
  .estcard .top{background:var(--ink);color:#fff;padding:22px 22px 20px;text-align:center;}
  .estcard .top .lbl{font-size:12.5px;letter-spacing:1px;text-transform:uppercase;color:#c9c9c9;margin-bottom:6px;}
  .estcard .top .amt{font-size:34px;font-weight:800;letter-spacing:-.5px;}
  .estcard .top .fin{margin-top:8px;font-size:13.5px;color:#ffd24a;font-weight:600;}
  .estcard .body{padding:20px 22px;}
  .estrow{display:flex;justify-content:space-between;gap:14px;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line);color:var(--muted);}
  .estrow:last-child{border:none;}
  .estrow b{color:var(--ink);font-weight:600;text-align:right;}
  .disc{font-size:11.5px;color:var(--muted);margin-top:12px;}
  .showcase{margin-bottom:18px;}
  .showcase .sc-title{font-size:13px;font-weight:700;color:var(--ink);margin:2px 0 8px;display:flex;align-items:center;gap:6px;}
  .showcase .sc-title svg{color:var(--red);}
  .showcase .frame{position:relative;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);line-height:0;}
  .showcase .frame img{width:100%;height:220px;object-fit:cover;display:block;}
  .showcase .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 12px;
    background:linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0));color:#fff;font-size:12.5px;font-weight:700;line-height:1.3;}
  .lead .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .lead .fld{margin-bottom:0;}
  .lead .fld.full{grid-column:1/-1;}
  .done{text-align:center;padding:14px 0;}
  .done .check{width:72px;height:72px;border-radius:50%;background:var(--green);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;}
  .trust{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;}
  .trust .t{font-size:11.5px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 11px;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:5px;}
  .trust .t svg{color:var(--red);}
  footer{padding:16px 20px;text-align:center;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:#fff;}
  footer a{color:var(--red);text-decoration:none;font-weight:600;}
  .pill{display:inline-block;background:#eafaf0;color:var(--green);font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;margin-bottom:14px;}
  @media(max-width:430px){
    h1{font-size:21px}.sub{font-size:14px}
    main{padding:20px 15px 34px}
    .lead .grid2{grid-template-columns:1fr}
    .pic{width:74px;height:64px}.swatch{width:78px;height:56px}
    header{padding:11px 15px}header .brand{height:44px}header .award{font-size:9.5px;padding:4px 8px}
    .hero img{height:180px}
    .opt{padding:11px 12px;gap:11px;font-size:15px}
    .estcard .top{padding:20px 14px 18px}.estcard .top .amt{font-size:27px;letter-spacing:-.6px}
    .estcard .body{padding:18px 16px}
    .btn{padding:15px 16px;font-size:15px}.nav{gap:8px}
  }
  @media(max-width:360px){.estcard .top .amt{font-size:24px}h1{font-size:20px}}
</style>
<script src="/config.js?v=2"></script>
</head>
<body>
<div class="wrap">
  <header>
    <img class="brand" src="https://images.leadconnectorhq.com/image/f_webp/q_85/r_600/u_https://assets.cdn.filesafe.space/M9VHO94IcX1ZpQpZrvNj/media/6937219950387f1a86579a58.png" alt="Twin Bridge Roofing &amp; Construction">
    <div class="award">🏆 QCBR<b>Remodeler of the Year</b></div>
  </header>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <main id="main"></main>
  <footer>Quad Cities' Trusted Roofing &amp; Exterior Experts · <a href="tel:5636554902">(563) 655-4902</a> · Licensed &amp; Insured</footer>
</div>

<script>
/* ============ REAL PHOTOS (Twin Bridge project gallery, served via the roofqc.com image CDN) ============ */
const M = 'https://assets.cdn.filesafe.space/M9VHO94IcX1ZpQpZrvNj/media/';
const rz = (file, w) => `https://images.leadconnectorhq.com/image/f_webp/q_82/r_${w}/u_${M}${file}`;
const PH = {
  hero:     '/hero.jpg?v=1',
  roof:     '/roof.jpg?v=1',
  repair:   '/repair.jpg?v=1',
  siding:   rz('69406b7797c023d2b6496248.jpg', 500),
  storm:    '/storm.jpg?v=1',
  showcase: rz('69406abaab2594bc8220009e.jpg', 1000)
};
const SERVICE_PHOTO = {'roof-replacement':PH.roof,'roof-repair':PH.repair,'siding':PH.siding,'storm':PH.storm};

/* ============ MATERIAL SWATCHES (small texture chips) ============ */
const ART = {
  sw_class3:`<img class="prod" src="${rz('6937b63d50387fc99074d20a.png',320)}" alt="TAMKO Titan XT">`,
  sw_class4:`<img class="prod" src="${rz('6937b613aba1f6581dc32a74.png',320)}" alt="TAMKO Stormfighter Flex">`,
  sw_synth:`<img class="prod" src="${rz('6937b326aba1f65ae6c2c642.webp',320)}" alt="Brava synthetic">`,
  sw_help:`<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><rect width="60" height="60" fill="#eef2f6"/><text x="30" y="40" font-size="34" font-weight="800" text-anchor="middle" fill="#e31e24" font-family="Arial">?</text></svg>`,
  sw_vinyl:`<img class="prod fill" src="${rz('694319eda156350c1870ac90.png',320)}" alt="Royal Estate vinyl siding">`,
  sw_comp:`<img class="prod fill" src="/composite.jpg?v=1" alt="Composite wood-grain siding">`,
  sw_steel:`<img class="prod fill" src="${rz('694336892c8abe2287d92a7c.jpg',320)}" alt="Quality Edge Vesta steel siding in Natural Oak woodgrain">`
};
function shingleRows(a,b){let s='';for(let r=0;r<5;r++){const y=8+r*11;for(let c=0;c<6;c++){const x=(r%2?5:0)+c*11;s+=`<rect x="${x}" y="${y}" width="10" height="9" fill="${c%2?a:b}"/>`;}}return s;}
function slateRows(){let s='';for(let r=0;r<5;r++){const y=6+r*11;for(let c=0;c<5;c++){const x=(r%2?6:0)+c*12;s+=`<rect x="${x}" y="${y}" width="11" height="10" rx="1.5" fill="${(r+c)%2?'#5a6570':'#414b55'}"/>`;}}return s;}
function lapRows(c){let s='';for(let r=0;r<6;r++){s+=`<rect x="0" y="${r*10}" width="60" height="8" fill="${c}"/>`;}return s;}

/* ============ PRICING CONFIG ============ */
const SERVICES = {
  "roof-replacement": {
    label:"Roof Replacement", tag:"Full roof, priced per square foot",
    steps:[
      {key:"address", type:"text", q:"What's the property address?",
       hint:"We'll measure your roof from satellite automatically. Rural addresses may not be covered — you can set the size on the next screen.",
       placeholder:"123 Main St, Moline, IL"},
      {key:"size", type:"slider", q:"About how big is your roof?",
       hint:"Auto-filled from your address when available — adjust if needed.",
       min:900,max:4000,step:50,def:1800,unit:"sq ft"},
      {key:"material", type:"choice", q:"What roofing material would you like?",
       opts:[
         {t:"Class 3 Shingles", sm:"TAMKO Titan XT — premium architectural, the QC standard", img:"sw_class3", mult:1.00},
         {t:"Class 4 Shingles", sm:"Stormfighter Flex — Class 4 impact-rated, may lower insurance", img:"sw_class4", mult:1.20, tag:"Popular"},
         {t:"Synthetic (Slate/Shake)", sm:"Brava — premium synthetic slate/shake, 50-yr", img:"sw_synth", mult:1.75},
         {t:"Not sure — help me choose", sm:"We'll help you pick on your free estimate", img:"sw_help", mult:1.00}
       ]},
      {key:"steep", type:"choice", q:"How steep is your roof?",
       opts:[
         {t:"Low / walkable", sm:"Easy pitch", mult:1.00},
         {t:"Moderate", sm:"Standard pitch", mult:1.15},
         {t:"Steep", sm:"Hard to walk", mult:1.30}
       ]},
      {key:"timing", type:"choice", q:"When are you looking to get this done?",
       opts:[{t:"As soon as possible",sm:""},{t:"1–3 months",sm:""},{t:"Just researching",sm:""}]}
    ],
    compute(a){ const size=a.size||1800, base=[5.50,7.50], m=a.material.mult, s=a.steep.mult;
      return [size*base[0]*m*s, size*base[1]*m*s]; }
  },
  "roof-repair": {
    label:"Roof Repair", tag:"Leaks, missing shingles, storm patches",
    steps:[
      {key:"problem", type:"choice", q:"What's going on with your roof?",
       opts:[
         {t:"Minor leak in one spot", sm:"", base:[200,600]},
         {t:"Missing / damaged shingles", sm:"", base:[300,900]},
         {t:"Storm damage / multiple areas", sm:"", base:[1200,3800]},
         {t:"Not sure — need it looked at", sm:"", base:[200,3800]}
       ]},
      {key:"material", type:"choice", q:"What roofing material do you have?",
       opts:[
         {t:"Class 3 Shingles", sm:"TAMKO Titan XT architectural", img:"sw_class3", mult:1.00},
         {t:"Class 4 Shingles", sm:"Stormfighter Flex — impact-resistant", img:"sw_class4", mult:1.10},
         {t:"Synthetic (Slate/Shake)", sm:"Brava synthetic", img:"sw_synth", mult:1.45},
         {t:"Not sure", sm:"", img:"sw_help", mult:1.10}
       ]},
      {key:"access", type:"choice", q:"How easy is the roof to get to?",
       opts:[
         {t:"Easy / single story", sm:"", mult:1.00},
         {t:"Moderate", sm:"", mult:1.15},
         {t:"Difficult / steep / tall", sm:"", mult:1.30}
       ]}
    ],
    compute(a){ const b=a.problem.base, m=a.material.mult*a.access.mult; return [b[0]*m, b[1]*m]; }
  },
  "siding": {
    label:"Siding Replacement", tag:"Vinyl, composite or steel",
    steps:[
      {key:"size", type:"choice", q:"What size is your home?",
       opts:[
         {t:"Small", sm:"≈ 1 story, under 1,500 sq ft", base:[7000,13000]},
         {t:"Medium", sm:"≈ 1,500–2,200 sq ft", base:[9000,18000]},
         {t:"Large", sm:"≈ 2,200–3,000 sq ft", base:[12000,24000]},
         {t:"Extra Large", sm:"≈ 3,000–4,000 sq ft", base:[15000,30000]},
         {t:"Very Large", sm:"Over 4,000 sq ft", base:[19000,38000]},
         {t:"Not sure", sm:"We'll measure it", base:[12000,24000]}
       ]},
      {key:"material", type:"choice", q:"What siding material do you want?",
       opts:[
         {t:"Vinyl", sm:"Royal Estate — most popular", img:"sw_vinyl", mult:1.00},
         {t:"Composite", sm:"Engineered wood-grain — premium look", img:"sw_comp", mult:1.25},
         {t:"Steel", sm:"Vesta woodgrain — most durable", img:"sw_steel", mult:1.40},
         {t:"Not sure", sm:"", img:"sw_help", mult:1.00}
       ]},
      {key:"tearoff", type:"choice", q:"Does the old siding need to come off first?",
       opts:[
         {t:"Yes, remove old siding", sm:"", mult:1.15},
         {t:"No / not sure", sm:"", mult:1.00}
       ]}
    ],
    compute(a){ const b=a.size.base, m=a.material.mult*a.tearoff.mult; return [b[0]*m, b[1]*m]; }
  },
  "storm": {
    label:"Storm Damage", tag:"Free inspection + insurance help", inspectionOnly:true,
    steps:[
      {key:"what", type:"choice", q:"What kind of storm damage are you dealing with?",
       opts:[{t:"Hail",sm:""},{t:"Wind",sm:""},{t:"Fallen tree / debris",sm:""},{t:"Not sure — looks off",sm:""}]},
      {key:"when", type:"choice", q:"When did the storm hit?",
       opts:[{t:"In the last 30 days",sm:""},{t:"1–6 months ago",sm:""},{t:"Not sure",sm:""}]},
      {key:"claim", type:"choice", q:"Have you filed an insurance claim yet?",
       opts:[{t:"Not yet",sm:"We can help"},{t:"Yes, already filed",sm:""},{t:"Not sure how",sm:"We'll walk you through it"}]}
    ]
  }
};

/* ============ PRODUCTION CONFIG ============ */
const CONFIG = {
  X360_LEAD_WEBHOOK: "https://services.leadconnectorhq.com/hooks/M9VHO94IcX1ZpQpZrvNj/webhook-trigger/5f14c90b-3617-4e4b-bf6a-eb2fe810a004"
};

let state = { screen:'intro', service:null, step:0, answers:{}, size:1800 };
const main = document.getElementById('main');
const bar = document.getElementById('bar');
const money = n => '$'+(Math.round(n/50)*50).toLocaleString();

function totalSteps(){ return state.service ? SERVICES[state.service].steps.length : 1; }
function setProgress(){
  let pct=6;
  if(state.screen==='quiz') pct = 10 + (state.step/totalSteps())*55;
  else if(state.screen==='estimate') pct=70;
  else if(state.screen==='lead') pct=85;
  else if(state.screen==='done') pct=100;
  bar.style.width=pct+'%';
}
function render(){
  setProgress();
  ({intro:renderIntro,quiz:renderQuiz,estimate:renderEstimate,lead:renderLead,done:renderDone})[state.screen]();
}

function renderIntro(){
  main.innerHTML = `
    <div class="step">
      <div class="hero"><img src="${PH.hero}" alt="Twin Bridge Roofing project" loading="eager"><div class="ov"><span>Quad Cities' Award-Winning Roofer</span></div></div>
      <span class="pill">● Free · Takes 30 seconds</span>
      <div class="eyebrow">Instant Estimate</div>
      <h1>What can we help you with?</h1>
      <p class="sub">Get a real ballpark price for your Quad Cities home — no waiting on a callback.</p>
      <div class="cards">
        ${Object.entries(SERVICES).map(([k,s])=>`
          <button class="opt" onclick="pickService('${k}')">
            <span class="pic"><img src="${SERVICE_PHOTO[k]}" alt="" loading="lazy"></span>
            <span>${s.label}<span class="sm">${s.tag}</span></span>
            <span class="chev">${chev()}</span>
          </button>`).join('')}
      </div>
    </div>`;
}
window.pickService = k => {
  state.service=k; state.step=0; state.answers={}; state.screen='quiz';
  state.measured=null; state.measuring=false; state.addrLatLon=null;
  const sl=(SERVICES[k].steps||[]).find(s=>s.type==='slider'); if(sl) state.size=sl.def||state.size;
  render();
};

function renderQuiz(){
  const s = SERVICES[state.service];
  const step = s.steps[state.step];
  let inner='';
  if(step.type==='choice'){
    inner = `<div class="cards">${step.opts.map((o,i)=>`
      <button class="opt" onclick="answer(${i})">
        ${o.img?`<span class="swatch">${ART[o.img]}</span>`:''}
        <span>${o.t}${o.sm?`<span class="sm">${o.sm}</span>`:''}${o.tag?`<span class="tag">${o.tag}</span>`:''}</span>
        <span class="chev">${chev()}</span>
      </button>`).join('')}</div>`;
  } else if(step.type==='slider'){
    inner = `
      <div class="field">
        <div class="sizeout" id="sizeout">${state.size.toLocaleString()} <small>${step.unit}</small></div>
        <input type="range" min="${step.min}" max="${step.max}" step="${step.step}" value="${state.size}"
          oninput="document.getElementById('sizeout').innerHTML=(+this.value).toLocaleString()+' <small>${step.unit}</small>';state.size=+this.value;">
        <div class="rangelabels"><span>${step.min.toLocaleString()}</span><span>${step.max.toLocaleString()}+</span></div>
      </div>
      <div id="measbox">${state.measuring ? measuringBox() : (state.measured ? measuredBox() : `<div class="note">${infoIcon()}<span>${step.hint}</span></div>`)}</div>`;
  } else if(step.type==='text'){
    inner = `
      <div class="addrwrap">
        <input type="text" id="txt" autocomplete="off" placeholder="${step.placeholder||''}" value="${state.answers[step.key]?.raw||''}" oninput="addrInput(this.value)">
        <div class="addrsug" id="addrsug"></div>
      </div>
      <div class="note">${infoIcon()}<span>${step.hint}</span></div>`;
  }
  main.innerHTML = `
    <div class="step">
      <div class="eyebrow">${s.label} · Step ${state.step+1} of ${s.steps.length}</div>
      <h1>${step.q}</h1>
      <div style="height:12px"></div>
      ${inner}
      <div class="nav">
        <button class="btn-ghost btn" onclick="back()">←</button>
        ${step.type!=='choice'?`<button class="btn btn-primary" onclick="nextFromField()">Continue</button>`:''}
      </div>
    </div>`;
}
function measuredBox(){
  return `<div class="measured">${checkIcon()}<span>Roof measured from satellite: about ${state.measured.toLocaleString()} sq ft. Adjust the slider if needed.</span></div>`;
}
window.answer = i => { const s=SERVICES[state.service], step=s.steps[state.step]; state.answers[step.key]=step.opts[i]; advance(); };
window.nextFromField = () => {
  const s=SERVICES[state.service], step=s.steps[state.step];
  if(step.type==='slider'){ state.answers[step.key]={raw:state.size,t:state.size.toLocaleString()+' sq ft'}; }
  if(step.type==='text'){ state.answers[step.key]={raw:document.getElementById('txt').value}; }
  advance();
};
function advance(){
  const s=SERVICES[state.service];
  if(state.step < s.steps.length-1){ state.step++; render(); }
  else { state.screen='lead'; render(); }
}
window.back = () => {
  if(state.step>0){ state.step--; render(); } else { state.screen='intro'; state.service=null; state.measured=null; render(); }
};

/* Address autocomplete — free (Photon/OpenStreetMap), biased to the Quad Cities. */
let _addrTimer=null;
window.addrInput = (q) => {
  const box=document.getElementById('addrsug'); if(!box) return;
  state.answers.address={raw:q};
  clearTimeout(_addrTimer);
  if(!q || q.length<4){ box.style.display='none'; box.innerHTML=''; return; }
  _addrTimer=setTimeout(async ()=>{
    try{
      const url=`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=5&lang=en&lat=41.52&lon=-90.57`;
      const j=await (await fetch(url)).json();
      const items=(j.features||[]).map(f=>{
        const p=f.properties||{};
        const label=[[p.housenumber,p.street].filter(Boolean).join(' '), p.city||p.name, [p.state,p.postcode].filter(Boolean).join(' ')].filter(Boolean).join(', ');
        const c=(f.geometry&&f.geometry.coordinates)||null;
        return {label, zip:p.postcode||'', lat:c?c[1]:null, lon:c?c[0]:null};
      }).filter(x=>x.label);
      if(!items.length){ box.style.display='none'; return; }
      box._items=items;
      box.innerHTML=items.map((it,i)=>`<div class="addropt" onclick="pickAddr(${i})">${pinIcon()}<span>${it.label}</span></div>`).join('');
      box.style.display='block';
    }catch(e){ box.style.display='none'; }
  }, 250);
};
window.pickAddr = (i) => {
  const box=document.getElementById('addrsug'); const it=(box._items||[])[i]; if(!it) return;
  const inp=document.getElementById('txt'); if(inp) inp.value=it.label;
  state.answers.address={raw:it.label};
  if(it.zip) state.addrZip=it.zip;
  if(it.lat!=null){ state.addrLatLon={lat:it.lat,lon:it.lon}; startMeasure(it.lat,it.lon); }
  box.style.display='none'; box.innerHTML='';
};

/* ============ SATELLITE AUTO-MEASURE (Google Solar) ============ */
/* Key is loaded from /config.js (window.SOLAR_KEY), referrer-locked to *.roofqc.com.
   Never hardcoded here so it can be rotated without touching app code. */
const SOLAR = { key:(typeof window!=='undefined'&&window.SOLAR_KEY)||'', cap:60 };
function solarDay(){ try{ return new Date().toISOString().slice(0,10); }catch(e){ return 'na'; } }
function solarCapOk(){
  try{ const r=JSON.parse(localStorage.getItem('tbSolar')||'{}'); return r.d!==solarDay() || (r.n||0)<SOLAR.cap; }
  catch(e){ return true; }
}
function solarBump(){
  try{ const r=JSON.parse(localStorage.getItem('tbSolar')||'{}'); const n=(r.d===solarDay()?(r.n||0):0)+1;
    localStorage.setItem('tbSolar',JSON.stringify({d:solarDay(),n})); }catch(e){}
}
async function measureRoof(lat,lon){
  try{
    if(!SOLAR.key || lat==null || lon==null) return null;
    if(!solarCapOk()) return null;
    const u=`https://solar.googleapis.com/v1/buildingInsights:findClosest?location.latitude=${lat}&location.longitude=${lon}&requiredQuality=LOW&key=${SOLAR.key}`;
    const r=await fetch(u); if(!r.ok) return null; solarBump();
    const j=await r.json();
    const segs=(j&&j.solarPotential&&j.solarPotential.roofSegmentStats)||[];
    let sqft=0;
    for(const s of segs){ const a=(s&&s.stats&&s.stats.areaMeters2)||0;
      const p=((s&&s.pitchDegrees!=null)?s.pitchDegrees:22)*Math.PI/180;
      const c=Math.max(Math.cos(p),0.5); sqft+=(a/c)*10.7639; }
    if(!(sqft>0)) return null;
    return Math.round(sqft/50)*50;
  }catch(e){ return null; }
}
async function startMeasure(lat,lon){
  if(!SOLAR.key) return;
  state.measuring=true; state.measured=null; refreshMeasbox();
  const sqft=await measureRoof(lat,lon);
  state.measuring=false;
  if(sqft){ const sl=(SERVICES[state.service]&&SERVICES[state.service].steps||[]).find(s=>s.type==='slider');
    let v=sqft; if(sl){ v=Math.min(Math.max(sqft,sl.min),sl.max); }
    state.measured=sqft; state.size=v; }
  refreshMeasbox(); refreshSlider();
}
function measuringBox(){ return `<div class="note" style="background:#eef7ff;border-color:#bfe0ff;color:#3a6ea5;">${infoIcon()}<span>Measuring your roof from satellite…</span></div>`; }
function refreshMeasbox(){
  const box=document.getElementById('measbox'); if(!box) return;
  const step=SERVICES[state.service]&&SERVICES[state.service].steps[state.step];
  if(!step||step.type!=='slider') return;
  box.innerHTML = state.measuring ? measuringBox() : (state.measured ? measuredBox() : `<div class="note">${infoIcon()}<span>${step.hint}</span></div>`);
}
function refreshSlider(){
  const step=SERVICES[state.service]&&SERVICES[state.service].steps[state.step]; if(!step||step.type!=='slider') return;
  const inp=document.querySelector('input[type=range]'); const out=document.getElementById('sizeout');
  if(inp) inp.value=state.size; if(out) out.innerHTML=state.size.toLocaleString()+' <small>'+step.unit+'</small>';
}

function estInput(){
  const o = {...state.answers};
  if(SERVICES[state.service].steps.some(st=>st.type==='slider')) o.size = state.size;
  return o;
}
function renderEstimate(){
  const s=SERVICES[state.service];
  const a=estInput();
  const [lo,hi]=s.compute(a);
  const mid=(lo+hi)/2;
  const mo=Math.round((mid*(0.0999/12))/(1-Math.pow(1+0.0999/12,-120))/5)*5;
  const first = state.lead ? state.lead.name.split(' ')[0] : 'there';
  main.innerHTML = `
    <div class="step">
      <div class="eyebrow">Your Instant Estimate</div>
      <h1>Thanks, ${first}! Here's your ${s.label.toLowerCase()} estimate</h1>
      <p class="sub">A detailed written estimate is on its way to ${state.lead?state.lead.email:'your email'} — and we'll call to schedule your free on-site estimate to lock in the exact price.</p>
      <div class="estcard">
        <div class="top">
          <div class="lbl">Estimated Project Range</div>
          <div class="amt">${money(lo)} – ${money(hi)}</div>
          <div class="fin">or as low as ~$${mo.toLocaleString()}/mo with financing*</div>
        </div>
        <div class="body">
          ${summaryRows(s)}
          <p class="disc">*Illustrative only (sample 10-yr term). Actual financing set by your provider. This range is a ballpark, not a formal quote — final price confirmed after a free on-site estimate.</p>
        </div>
      </div>
      ${showcaseBlock()}
      <div class="nav">
        <button class="btn-ghost btn" onclick="location.reload()">Start over</button>
        <button class="btn btn-primary" onclick="window.location.href='tel:5636554902'">Call (563) 655-4902</button>
      </div>
      ${trust()}
    </div>`;
}
function showcaseBlock(){
  return `<div class="showcase">
    <div class="sc-title">${camIcon()} Real Twin Bridge work in the Quad Cities</div>
    <div class="frame"><img src="${PH.showcase}" alt="Completed Twin Bridge roofing project" loading="lazy">
      <div class="cap">Another Quad Cities roof done right — licensed, insured &amp; warrantied.</div>
    </div>
  </div>`;
}
function summaryRows(s){
  return s.steps.filter(st=>st.type==='choice'||st.type==='slider').map(st=>{
    const ans=state.answers[st.key];
    let v = st.type==='slider' ? (state.size.toLocaleString()+' sq ft') : (ans?ans.t:'—');
    return `<div class="estrow"><span>${st.q}</span><b>${v}</b></div>`;
  }).join('');
}

function renderLead(){
  const s=SERVICES[state.service];
  const headline = s.inspectionOnly ? "Book your free storm inspection" : "Your instant estimate is ready";
  const subtxt = s.inspectionOnly
    ? "We'll document the damage, help with your insurance claim, and never quote a repair price that could hurt your claim."
    : "Enter your details to see your price. We'll also email a detailed written estimate and call to schedule your free, no-pressure on-site estimate.";
  main.innerHTML = `
    <div class="step lead">
      <div class="eyebrow">${s.inspectionOnly?'Free Inspection':'One last step'}</div>
      <h1>${headline}</h1>
      <p class="sub">${subtxt}</p>
      <div class="grid2">
        <div class="fld"><input type="text" id="f_name" placeholder="Full name *"></div>
        <div class="fld"><input type="tel" id="f_phone" placeholder="Phone *"></div>
        <div class="fld full"><input type="email" id="f_email" placeholder="Email *"></div>
        <div class="fld full"><input type="text" id="f_zip" placeholder="Property ZIP code *" value="${state.addrZip||''}"></div>
      </div>
      <div class="nav">
        <button class="btn-ghost btn" onclick="${s.inspectionOnly?"back()":"state.screen='quiz';render()"}">←</button>
        <button class="btn btn-primary" onclick="submitLead()">${s.inspectionOnly?'Book free inspection':'Unlock my estimate →'}</button>
      </div>
      <div class="note" style="margin-top:14px;background:#eef7ff;border-color:#bfe0ff;color:#3a6ea5;">${lockIcon()}<span>Your info is safe. We only use it to prepare your estimate and schedule your free on-site estimate — no spam.</span></div>
    </div>`;
}
window.submitLead = async () => {
  const name=v('f_name'), phone=v('f_phone'), email=v('f_email'), zip=v('f_zip');
  if(!name||!phone||!email||!zip){ alert('Please fill in name, phone, email, and ZIP.'); return; }
  const s=SERVICES[state.service];
  let est='Free inspection requested';
  if(!s.inspectionOnly){ const a=estInput(); const [lo,hi]=s.compute(a); est=money(lo)+' – '+money(hi); }
  const details = s.steps.filter(st=>st.type==='choice'||st.type==='slider')
    .map(st=> st.q+': '+(st.type==='slider'? state.size.toLocaleString()+' sq ft' : (state.answers[st.key]?.t||'—'))).join(' | ');
  const payload = { source:'Instant Estimator (roofqc.com)', full_name:name, phone, email, postal_code:zip,
    service:s.label, estimate_range:est, details, address: state.answers.address?.raw || '' };
  state.lead={name,phone,email,zip};
  const btn=document.querySelector('.lead .btn-primary'); if(btn){ btn.textContent='Sending…'; btn.disabled=true; }
  if(CONFIG.X360_LEAD_WEBHOOK){
    try{ await fetch(CONFIG.X360_LEAD_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); }
    catch(e){}
  }
  state.screen = s.inspectionOnly ? 'done' : 'estimate'; render();
};
function v(id){return (document.getElementById(id).value||'').trim();}

function renderDone(){
  const s=SERVICES[state.service];
  main.innerHTML = `
    <div class="step done">
      <div class="check"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
      <h1>You're all set, ${state.lead.name.split(' ')[0]}!</h1>
      <p class="sub">${s.inspectionOnly
        ? "Your free storm inspection request is in. We'll call shortly to lock in a time and walk you through the insurance side."
        : "Your estimate is on its way to "+state.lead.email+". We'll reach out to schedule your free on-site estimate."}</p>
      <div class="estcard" style="text-align:left;margin-top:6px;"><div class="body">
        <div class="estrow"><span>Service</span><b>${s.label}</b></div>
        <div class="estrow"><span>Name</span><b>${state.lead.name}</b></div>
        <div class="estrow"><span>Phone</span><b>${state.lead.phone}</b></div>
        <div class="estrow"><span>ZIP</span><b>${state.lead.zip}</b></div>
      </div></div>
      <div class="nav"><button class="btn btn-primary" onclick="location.reload()">Start over</button></div>
      ${trust()}
    </div>`;
}

function trust(){
  return `<div class="trust">
    <span class="t">${chk()} QCBR Remodeler of the Year 2024</span>
    <span class="t">${chk()} Winner — 2026 BBB Torch Award for Ethics</span>
    <span class="t">${chk()} TAMKO Diamond Pro certified</span>
    <span class="t">${chk()} Lifetime workmanship &amp; materials warranty</span>
    <span class="t">${chk()} Licensed &amp; insured · family-owned</span>
    <span class="t">${chk()} Insurance-claim help</span>
  </div>`;
}
function chk(){return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';}
function checkIcon(){return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';}
function chev(){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';}
function infoIcon(){return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>';}
function camIcon(){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';}
function pinIcon(){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';}
function lockIcon(){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';}

render();
</script>
